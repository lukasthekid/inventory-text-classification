[project]
name = "inventory-text-classification"
version = "0.1.0"
description = "Invoice text classification using fine-tuned DistilBERT for German construction/inventory descriptions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.1.0",
    "torch>=2.9",
    "torchvision>=0.24",
    "transformers>=4.57",
    "pandas>=2.3",
    "scikit-learn>=1.8",
    "numpy>=2.3,<2.4",
    "matplotlib>=3.10",
    "seaborn>=0.13",
    "mlflow>=3.8",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "notebook>=7.5",
    "ipykernel>=7.1",
]
